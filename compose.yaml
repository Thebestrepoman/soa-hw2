services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-marketplace}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/marketplace
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-marketplace}
      JWT_SECRET: ${JWT_SECRET:?Run cp .env.example .env before starting}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ORDER_INTERVAL: ${ORDER_INTERVAL:-PT1M}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/openapi.yaml"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
